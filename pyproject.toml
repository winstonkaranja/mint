[project]
name = "mint"
version = "0.1.0"
description = "Generic email & calendar MCP server supporting Gmail and Outlook"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
azure = ["msal>=1.28"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
